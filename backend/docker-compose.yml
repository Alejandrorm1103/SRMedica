version: '3.8'

services:
  # ========================================
  # PostgreSQL Database
  # ========================================
  postgres:
    image: postgres:16-alpine
    container_name: srmedica-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-srmedica_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-srmedica_db}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - srmedica-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-srmedica_app}']
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Backend API
  # ========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: srmedica-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-srmedica_app}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-srmedica_db}
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - '${PORT:-3000}:3000'
    networks:
      - srmedica-network
    healthcheck:
      test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ========================================
  # Adminer (Database Management - Optional)
  # ========================================
  adminer:
    image: adminer:latest
    container_name: srmedica-adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - '${ADMINER_PORT:-8080}:8080'
    networks:
      - srmedica-network
    environment:
      ADMINER_DEFAULT_SERVER: postgres

# ========================================
# Networks
# ========================================
networks:
  srmedica-network:
    driver: bridge

# ========================================
# Volumes
# ========================================
volumes:
  postgres_data:
    driver: local
